[package]
name = "cantus"
version = "0.1.0"
description = "Cantus — a Claude-first coding environment"
authors = ["Manan Wadhwa"]
edition = "2021"

[lib]
name = "cantus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
sha2 = "0.10"
notify = "6"
tokio = { version = "1", features = ["sync"] }
portable-pty = "0.8"
base64 = "0.22"
git2 = "0.19"

